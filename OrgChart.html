<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>組織図サンプル（アシスタント・実人数対応版）</title>
    <script src="https://unpkg.com/gojs/release/go.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; background: #fdfdfd; }
        #main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100%; }
        #controls { padding: 10px; background: #f1f3f5; border-bottom: 1px solid #ccc; display: flex; flex-direction: column; gap: 8px; }
        .control-row { display: flex; align-items: center; gap: 15px; font-size: 13px; flex-wrap: wrap; }
        #myDiagramDiv { flex-grow: 1; background: transparent; }
        
        #sidebar {
            width: 440px; background: #fff; border-left: 1px solid #ccc;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            transform: translateX(100%); transition: transform 0.3s ease;
            position: absolute; right: 0; top: 0; height: 100%; z-index: 10;
        }
        #sidebar.open { transform: translateX(0); }
        #sidebar-header { padding: 15px; background: #666; color: white; display: flex; justify-content: space-between; align-items: center; }
        #sidebar-content { padding: 15px; overflow-y: auto; flex-grow: 1; }
        table.member-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        table.member-table th, table.member-table td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        table.member-table th { background: #f8f9fa; }
        .close-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }

        .btn-export {
            background-color: #2196F3; color: white; padding: 5px 10px;
            border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .btn-export:hover { background-color: #0b7dda; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="controls">
            <div class="control-row">
                <input type="file" id="csvFile" accept=".csv" />
                <span style="color: #666; font-size: 12px;">※CSVに「番号」と「所属区分（主務/兼務）」を含んだCSVに対応しています。</span>
                
                <button class="btn-export" onclick="exportToSVG()">SVG保存</button>
            </div>
            <div class="control-row">
                <strong>ノード内表示:</strong>
                <label><input type="checkbox" class="disp-cb" id="cb-title" checked> 役職</label>
                <label><input type="checkbox" class="disp-cb" id="cb-name" checked> 氏名</label>
                <label><input type="checkbox" class="disp-cb" id="cb-gender"> 性別</label>
                <label><input type="checkbox" class="disp-cb" id="cb-blood"> 血液型</label>
            </div>
        </div>
        <div id="myDiagramDiv"></div>
    </div>

    <div id="sidebar">
        <div id="sidebar-header">
            <h3 id="sidebar-org-title" style="margin:0; font-size: 16px;">組織詳細</h3>
            <button class="close-btn" onclick="closeSidebar()">×</button>
        </div>
        <div id="sidebar-content">
            <div id="sidebar-summary" style="margin-bottom: 15px; font-size: 13px; line-height: 1.5; background: #f8f9fa; padding: 10px; border-radius: 4px;"></div>
            <h4 style="margin: 0 0 5px 0; font-size: 14px;">所属メンバー一覧（この部署のみ）</h4>
            <table class="member-table">
                <thead>
                    <tr><th>ID</th><th>役職</th><th>氏名</th><th>区分</th></tr>
                </thead>
                <tbody id="sidebar-member-tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const $ = go.GraphObject.make;
        let myDiagram;

        function exportToSVG() {
            if (!myDiagram || myDiagram.nodes.count === 0) {
                alert("エクスポートする組織図がありません。");
                return;
            }
            let svg = myDiagram.makeSvg({ scale: 1, background: "white" });
            let svgStr = new XMLSerializer().serializeToString(svg);
            let blob = new Blob([svgStr], { type: "image/svg+xml" });
            let url = URL.createObjectURL(blob);
            
            let a = document.createElement("a");
            a.style = "display: none";
            a.href = url;
            a.download = "organization_chart.svg";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function generateSummaryText(members) {
            if (!members) return "";
            const showTitle = document.getElementById('cb-title').checked;
            const showName = document.getElementById('cb-name').checked;
            const showGender = document.getElementById('cb-gender').checked;
            const showBlood = document.getElementById('cb-blood').checked;

            return members.map(m => {
                let mainParts = [];
                if (showTitle && m.title) mainParts.push(m.title);
                if (showName && m.name) mainParts.push(m.name);
                
                let subParts = [];
                if (showGender && m.gender) subParts.push(m.gender);
                if (showBlood && m.blood) subParts.push(m.blood + "型");

                let text = mainParts.join(": ");
                if (subParts.length > 0) {
                    text += text ? ` (${subParts.join("/")})` : `(${subParts.join("/")})`;
                }
                let suffix = m.kubunType === '兼務' ? ' [兼務]' : '';
                return (text + suffix).trim();
            }).filter(t => t.length > 0).join("\n");
        }

        function updateAllNodesSummary() {
            if (!myDiagram || !myDiagram.model) return;
            
            myDiagram.startTransaction("update display");
            const nodeDataArray = myDiagram.model.nodeDataArray;
            nodeDataArray.forEach(data => {
                if (data.members) {
                    const newText = generateSummaryText(data.members);
                    myDiagram.model.setDataProperty(data, "membersSummary", newText);
                }
            });
            myDiagram.commitTransaction("update display");
        }

        document.querySelectorAll('.disp-cb').forEach(cb => {
            cb.addEventListener('change', updateAllNodesSummary);
        });

        // ★ アシスタントを左右に振り分けて配置するカスタムレイアウト
        class SideTreeLayout extends go.TreeLayout {
            constructor() {
                super();
            }

            assignTreeVertexValues(v) {
                super.assignTreeVertexValues(v);
                if (!v.node) return;
                
                let assistantCount = 0;
                let it = v.node.findTreeChildrenNodes();
                while(it.next()) {
                    if (it.value.data.role === "assistant") assistantCount++;
                }
                
                if (assistantCount > 0) {
                    let rows = Math.ceil(assistantCount / 2);
                    v.layerSpacing = 80 + (rows * 120); 
                }
            }

            commitNodes() {
                super.commitNodes();
                
                let parentToAssistants = new Map();
                this.diagram.nodes.each(node => {
                    if (node.data.role === "assistant") {
                        let p = node.findTreeParentNode();
                        if (p) {
                            if (!parentToAssistants.has(p)) parentToAssistants.set(p, []);
                            parentToAssistants.get(p).push(node);
                        }
                    }
                });

                parentToAssistants.forEach((assistants, parent) => {
                    let pX = parent.location.x + (parent.actualBounds.width / 2);
                    let pY = parent.location.y + (parent.actualBounds.height / 2);
                    let leftCount = 0;
                    let rightCount = 0;
                    
                    let offsetX = 340; 
                    let offsetY = 120;

                    assistants.forEach((aNode, index) => {
                        let cx, cy;
                        if (index % 2 === 0) {
                            cx = pX - offsetX;
                            cy = pY + offsetY + (leftCount * 120);
                            leftCount++;
                        } else {
                            cx = pX + offsetX;
                            cy = pY + offsetY + (rightCount * 120);
                            rightCount++;
                        }
                        aNode.location = new go.Point(cx - (aNode.actualBounds.width / 2), cy - (aNode.actualBounds.height / 2));
                    });
                });
            }

            commitLinks() {
                super.commitLinks();
                this.diagram.links.each(link => {
                    if (link.toNode && link.toNode.data.role === "assistant") {
                        let pNode = link.fromNode;
                        let aNode = link.toNode;
                        
                        link.fromSpot = go.Spot.Bottom;
                        if (aNode.location.x < pNode.location.x) {
                            link.toSpot = go.Spot.Right;
                        } else {
                            link.toSpot = go.Spot.Left;
                        }
                        link.invalidateRoute();
                    }
                });
            }
        }

        function init() {
            myDiagram = $(go.Diagram, "myDiagramDiv", {
                contentAlignment: go.Spot.Center,
                layout: $(SideTreeLayout, {
                    angle: 90,
                    layerSpacing: 70,
                    nodeSpacing: 70,
                    alignment: go.TreeLayout.AlignmentCenterChildren
                }),
                "undoManager.isEnabled": true
            });

            myDiagram.nodeTemplate = $(go.Node, "Auto",
                {
                    movable: true,
                    click: (e, node) => showSidebar(node.data)
                },
                new go.Binding("isLayoutPositioned", "role", r => r !== "assistant"),
                
                $(go.Shape, "RoundedRectangle", { fill: "white", stroke: "#999", strokeWidth: 2, parameter1: 6 }),
                
                $(go.Panel, "Vertical", { margin: new go.Margin(6, 10, 6, 10), alignment: go.Spot.Left },
                    $(go.TextBlock, { font: "bold 13px sans-serif", stroke: "#333", margin: new go.Margin(0, 0, 3, 0) },
                        new go.Binding("text", "org")
                    ),
                    $(go.TextBlock, { font: "10px sans-serif", stroke: "#666", margin: new go.Margin(0, 0, 6, 0) },
                        new go.Binding("text", "", d => `延べ:${d.aggTotal}名 (実人数:${d.aggUniqueCount}名) [幹:${d.aggKanbu} 般:${d.aggIppan} 務:${d.aggJimu}]\n男:${d.aggMale} 女:${d.aggFemale} | A:${d.aggBlood.A} B:${d.aggBlood.B}`)
                    ),
                    $(go.TextBlock, { font: "10px monospace", stroke: "#bbb", margin: new go.Margin(0, 0, 2, 0) }, "----------------------------------"),
                    $(go.TextBlock, { font: "11px sans-serif", stroke: "#444", margin: new go.Margin(2, 0, 0, 0) },
                        new go.Binding("text", "membersSummary")
                    )
                )
            );

            myDiagram.linkTemplate = $(go.Link,
                { 
                    routing: go.Link.Orthogonal, 
                    corner: 5,
                    layerName: "Background" 
                },
                $(go.Shape, { strokeWidth: 1.5, stroke: "#999" })
            );
        }

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    const orgMap = {};

                    data.forEach(row => {
                        if (!row.組織名) return;

                        // ★ アシスタント判定（社長室の副社長などを横配置にするための処理）
                        const isAssistant = row.role && row.role.trim() === "assistant";
                        const nodeKey = isAssistant ? `${row.組織名}_${row.番号}` : row.組織名;
                        const parentKey = row.親組織名 === "なし" || !row.親組織名 ? "" : row.親組織名;

                        if (!orgMap[nodeKey]) {
                            orgMap[nodeKey] = {
                                key: nodeKey,
                                parent: parentKey,
                                org: isAssistant ? `${row.役職}: ${row.氏名}` : row.組織名,
                                role: isAssistant ? "assistant" : "normal",
                                total: 0, male: 0, female: 0,
                                kanbu: 0, ippan: 0, jimu: 0, otherClass: 0,
                                blood: { A: 0, B: 0, O: 0, AB: 0, その他: 0 },
                                members: [],
                                uniqueIds: new Set(),
                                childrenKeys: []
                            };
                        }

                        const target = orgMap[nodeKey];
                        target.total++;
                        target.uniqueIds.add(row.番号);

                        if (row.性別 === "男") target.male++;
                        else if (row.性別 === "女") target.female++;
                        if (target.blood[row.血液型] !== undefined) target.blood[row.血液型]++;
                        else target.blood.その他++;

                        const kubun = row.役職区分 ? row.役職区分.trim() : "";
                        if (["特別幹部", "一般幹部", "部外幹部"].includes(kubun)) {
                            target.kanbu++;
                        } else if (["上級一般職", "中級一般職", "下級一般職"].includes(kubun)) {
                            target.ippan++;
                        } else if (["上級事務職", "中級事務職", "下級事務職"].includes(kubun)) {
                            target.jimu++;
                        } else {
                            target.otherClass++;
                        }

                        target.members.push({
                            id: row.番号, 
                            title: row.役職, 
                            kubun: kubun, 
                            name: row.氏名, 
                            gender: row.性別, 
                            blood: row.血液型,
                            kubunType: row.所属区分 ? row.所属区分.trim() : "主務"
                        });
                    });

                    let rootKeys = [];
                    Object.keys(orgMap).forEach(key => {
                        const item = orgMap[key];
                        if (item.parent && orgMap[item.parent]) {
                            orgMap[item.parent].childrenKeys.push(key);
                        } else {
                            rootKeys.push(key);
                        }
                    });

                    function aggregateData(key) {
                        const node = orgMap[key];
                        node.aggTotal = node.total;
                        node.aggMale = node.male;
                        node.aggFemale = node.female;
                        node.aggKanbu = node.kanbu;
                        node.aggIppan = node.ippan;
                        node.aggJimu = node.jimu;
                        node.aggBlood = { ...node.blood };
                        
                        let combinedUniqueIds = new Set(node.uniqueIds);

                        node.childrenKeys.forEach(childKey => {
                            const childAgg = aggregateData(childKey);
                            node.aggTotal += childAgg.aggTotal;
                            node.aggMale += childAgg.aggMale;
                            node.aggFemale += childAgg.aggFemale;
                            node.aggKanbu += childAgg.aggKanbu;
                            node.aggIppan += childAgg.aggIppan;
                            node.aggJimu += childAgg.aggJimu;
                            
                            node.aggBlood.A += childAgg.aggBlood.A;
                            node.aggBlood.B += childAgg.aggBlood.B;
                            node.aggBlood.O += childAgg.aggBlood.O;
                            node.aggBlood.AB += childAgg.aggBlood.AB;
                            node.aggBlood.その他 += childAgg.aggBlood.その他;

                            childAgg.uniqueIds.forEach(id => combinedUniqueIds.add(id));
                        });

                        node.aggUniqueCount = combinedUniqueIds.size;
                        node.uniqueIds = combinedUniqueIds;
                        return node;
                    }

                    rootKeys.forEach(rootKey => aggregateData(rootKey));

                    const treeData = Object.keys(orgMap).map(key => {
                        const item = orgMap[key];
                        return { ...item, membersSummary: generateSummaryText(item.members) };
                    });

                    myDiagram.model = new go.TreeModel(treeData);
                }
            });
        });

        function showSidebar(nodeData) {
            document.getElementById('sidebar-org-title').innerText = nodeData.org + " の詳細";
            
            document.getElementById('sidebar-summary').innerHTML = 
                `<div style="padding: 8px; background: #f1f3f5; border-radius: 4px; margin-bottom: 10px;">` +
                `<b>【組織集計（配下含む）】</b><br>` +
                `延べ人数: ${nodeData.aggTotal}名 ／ 実人数: ${nodeData.aggUniqueCount}名<br>` +
                `幹部: ${nodeData.aggKanbu} / 一般: ${nodeData.aggIppan} / 事務: ${nodeData.aggJimu}<br>` +
                `</div>` +
                `<div><b>【${nodeData.org} 単体】</b><br>` +
                `延べ人数: ${nodeData.total}名 ／ 実人数: ${nodeData.uniqueIds.size}名</div>`;

            const tbody = document.getElementById('sidebar-member-tbody');
            tbody.innerHTML = "";
            if (nodeData.members) {
                nodeData.members.forEach(m => {
                    const tr = document.createElement('tr');
                    let kubunColor = m.kubunType === '兼務' ? 'color: red; font-weight: bold;' : '';
                    tr.innerHTML = `<td>${m.id}</td><td>${m.title}</td><td>${m.name}</td><td><span style="${kubunColor}">${m.kubunType}</span></td>`;
                    tbody.appendChild(tr);
                });
            }
            document.getElementById('sidebar').classList.add('open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
        }

        init();
    </script>
</body>
</html>

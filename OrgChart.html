<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>組織図サンプル（完全中央揃え・重なり解消版）</title>
    <script src="https://unpkg.com/gojs/release/go.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100%; }
        #controls { padding: 10px; background: #f1f3f5; border-bottom: 1px solid #ccc; }
        #myDiagramDiv { flex-grow: 1; background: #fdfdfd; }
        
        #sidebar {
            width: 380px; background: #fff; border-left: 1px solid #ccc;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            transform: translateX(100%); transition: transform 0.3s ease;
            position: absolute; right: 0; top: 0; height: 100%; z-index: 10;
        }
        #sidebar.open { transform: translateX(0); }
        #sidebar-header { padding: 15px; background: #007acc; color: white; display: flex; justify-content: space-between; align-items: center; }
        #sidebar-content { padding: 15px; overflow-y: auto; flex-grow: 1; }
        table.member-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        table.member-table th, table.member-table td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        table.member-table th { background: #f8f9fa; }
        .close-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="controls">
            <input type="file" id="csvFile" accept=".csv" />
            <span style="font-size: 12px; color: #666; margin-left: 10px;">※トップを基準に完全な左右対称で展開されます。</span>
        </div>
        <div id="myDiagramDiv"></div>
    </div>

    <div id="sidebar">
        <div id="sidebar-header">
            <h3 id="sidebar-org-title" style="margin:0; font-size: 16px;">組織詳細</h3>
            <button class="close-btn" onclick="closeSidebar()">×</button>
        </div>
        <div id="sidebar-content">
            <div id="sidebar-summary" style="margin-bottom: 15px; font-size: 13px; line-height: 1.5; background: #f8f9fa; padding: 10px; border-radius: 4px;"></div>
            <h4 style="margin: 0 0 5px 0; font-size: 14px;">所属メンバー一覧</h4>
            <table class="member-table">
                <thead>
                    <tr><th>番号</th><th>役職</th><th>氏名</th><th>性別</th><th>血液型</th></tr>
                </thead>
                <tbody id="sidebar-member-tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const $ = go.GraphObject.make;
        let myDiagram;

        class SideTreeLayout extends go.TreeLayout {
            constructor() {
                super();
            }

            assignTreeVertexValues(v) {
                super.assignTreeVertexValues(v);
                if (!v.node) return;
                
                let assistantCount = 0;
                // 通常のレイアウトネットワークから除外されたノードも取得
                let it = v.node.findTreeChildrenNodes();
                while(it.next()) {
                    if (it.value.data.role === "assistant") assistantCount++;
                }
                
                // アシスタントがいる場合、通常の部署を大きく下に押し下げる
                if (assistantCount > 0) {
                    let rows = Math.ceil(assistantCount / 2);
                    v.layerSpacing = 100 + (rows * 150); 
                }
            }

            commitNodes() {
                super.commitNodes();
                
                // アシスタントノードを親ごとにグループ化
                let parentToAssistants = new Map();
                this.diagram.nodes.each(node => {
                    if (node.data.role === "assistant") {
                        let p = node.findTreeParentNode();
                        if (p) {
                            if (!parentToAssistants.has(p)) parentToAssistants.set(p, []);
                            parentToAssistants.get(p).push(node);
                        }
                    }
                });

                // アシスタントを空いたスペース（左右）へ手動配置
                parentToAssistants.forEach((assistants, parent) => {
                    let pX = parent.location.x + (parent.actualBounds.width / 2);
                    let pY = parent.location.y + (parent.actualBounds.height / 2);
                    let leftCount = 0;
                    let rightCount = 0;
                    
                    let offsetX = 360; // 幹の線に被らないよう十分な横幅を確保
                    let offsetY = 140;

                    assistants.forEach((aNode, index) => {
                        let cx, cy;
                        if (index % 2 === 0) {
                            cx = pX - offsetX;
                            cy = pY + offsetY + (leftCount * 140);
                            leftCount++;
                        } else {
                            cx = pX + offsetX;
                            cy = pY + offsetY + (rightCount * 140);
                            rightCount++;
                        }
                        aNode.location = new go.Point(cx - (aNode.actualBounds.width / 2), cy - (aNode.actualBounds.height / 2));
                    });
                });
            }

            commitLinks() {
                super.commitLinks();
                this.diagram.links.each(link => {
                    if (link.toNode && link.toNode.data.role === "assistant") {
                        let pNode = link.fromNode;
                        let aNode = link.toNode;
                        
                        link.fromSpot = go.Spot.Bottom;
                        if (aNode.location.x < pNode.location.x) {
                            link.toSpot = go.Spot.Right;
                        } else {
                            link.toSpot = go.Spot.Left;
                        }
                        link.invalidateRoute();
                    }
                });
            }
        }

        function init() {
            myDiagram = $(go.Diagram, "myDiagramDiv", {
                contentAlignment: go.Spot.Center, // トップノードを画面中央に
                layout: $(SideTreeLayout, {
                    angle: 90,
                    layerSpacing: 80,
                    nodeSpacing: 80,
                    alignment: go.TreeLayout.AlignmentCenterChildren // 子ノードを中央基準で配置
                }),
                "undoManager.isEnabled": true
            });

            myDiagram.nodeTemplate = $(go.Node, "Auto",
                {
                    movable: true,
                    click: (e, node) => showSidebar(node.data)
                },
                // ★ここが鍵: assistantを標準の自動レイアウト計算から除外する
                new go.Binding("isLayoutPositioned", "role", r => r !== "assistant"),
                
                $(go.Shape, "RoundedRectangle", { fill: "white", stroke: "#007acc", strokeWidth: 2, parameter1: 6 }),
                $(go.Panel, "Vertical", { margin: 10, alignment: go.Spot.Left },
                    $(go.TextBlock, { font: "bold 14px sans-serif", stroke: "#333", margin: new go.Margin(0, 0, 4, 0) },
                        new go.Binding("text", "org")
                    ),
                    $(go.TextBlock, { font: "10px sans-serif", stroke: "#666", margin: new go.Margin(0, 0, 6, 0) },
                        new go.Binding("text", "", d => `計:${d.total}名 | 男:${d.male} 女:${d.female} | A:${d.blood.A} B:${d.blood.B} O:${d.blood.O} AB:${d.blood.AB}`)
                    ),
                    $(go.Shape, "LineH", { stroke: "#ddd", strokeWidth: 1, width: 220, margin: new go.Margin(0, 0, 6, 0) }),
                    $(go.TextBlock, { font: "12px sans-serif", stroke: "#444" },
                        new go.Binding("text", "membersSummary")
                    )
                )
            );

            myDiagram.linkTemplate = $(go.Link,
                { routing: go.Link.Orthogonal, corner: 5 },
                $(go.Shape, { strokeWidth: 1.5, stroke: "#007acc" })
            );
        }

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    const orgMap = {};

                    data.forEach(row => {
                        if (!row.組織名) return;

                        const isAssistant = row.role && row.role.trim() === "assistant";
                        const nodeKey = isAssistant ? `${row.組織名}_${row.番号}` : row.組織名;
                        const parentKey = row.親組織名 === "なし" || !row.親組織名 ? "" : row.親組織名;

                        if (!orgMap[nodeKey]) {
                            orgMap[nodeKey] = {
                                key: nodeKey,
                                parent: parentKey,
                                org: isAssistant ? `${row.役職}: ${row.氏名}` : row.組織名,
                                role: isAssistant ? "assistant" : "normal",
                                total: 0, male: 0, female: 0,
                                blood: { A: 0, B: 0, O: 0, AB: 0, その他: 0 },
                                members: []
                            };
                        }

                        const target = orgMap[nodeKey];
                        target.total++;
                        if (row.性別 === "男") target.male++;
                        else if (row.性別 === "女") target.female++;
                        if (target.blood[row.血液型] !== undefined) target.blood[row.血液型]++;
                        else target.blood.その他++;

                        target.members.push({
                            id: row.番号, title: row.役職, name: row.氏名, gender: row.性別, blood: row.血液型
                        });
                    });

                    const treeData = Object.keys(orgMap).map(key => {
                        const item = orgMap[key];
                        let summaryText = item.role === "assistant" 
                            ? `役職: ${item.members[0].title}\n氏名: ${item.members[0].name}`
                            : item.members.map(m => `${m.title}: ${m.name}`).join("\n");
                        return { ...item, membersSummary: summaryText };
                    });

                    myDiagram.model = new go.TreeModel(treeData);
                }
            });
        });

        function showSidebar(nodeData) {
            document.getElementById('sidebar-org-title').innerText = nodeData.org + " の詳細";
            const b = nodeData.blood;
            document.getElementById('sidebar-summary').innerHTML = 
                `<b>合計人数:</b> ${nodeData.total}名（男性: ${nodeData.male}名 / 女性: ${nodeData.female}名）<br>` +
                `<b>血液型内訳:</b> A型: ${b.A}名 | B型: ${b.B}名 | O型: ${b.O}名 | AB型: ${b.AB}名`;

            const tbody = document.getElementById('sidebar-member-tbody');
            tbody.innerHTML = "";
            nodeData.members.forEach(m => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${m.id}</td><td>${m.title}</td><td>${m.name}</td><td>${m.gender}</td><td>${m.blood}</td>`;
                tbody.appendChild(tr);
            });
            document.getElementById('sidebar').classList.add('open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
        }

        init();
    </script>
</body>
</html>
